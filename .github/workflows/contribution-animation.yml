name: Animate contributions

on:
  schedule:
    - cron: '21 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the animation generator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Draw the growing contribution snake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query='query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar { weeks { contributionDays { weekday contributionLevel } } }
              }
            }
          }'
          gh api graphql -F login="$GITHUB_REPOSITORY_OWNER" -f query="$query" \
            --jq '.data.user.contributionsCollection.contributionCalendar.weeks' \
            | node .github/scripts/contribution-snake.mjs dist

      - name: Publish the light and dark animations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/snake.svg
          test -s dist/snake-dark.svg
          gh auth setup-git
          git init --quiet --initial-branch=contribution-animation publish
          cd publish
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [[ -n "$(git ls-remote --heads origin refs/heads/contribution-animation)" ]]; then
            git fetch --depth=1 origin contribution-animation
            git reset --quiet FETCH_HEAD
          fi
          cp ../dist/snake.svg ../dist/snake-dark.svg .
          git add snake.svg snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh contribution snake'
          git push origin HEAD:refs/heads/contribution-animation
